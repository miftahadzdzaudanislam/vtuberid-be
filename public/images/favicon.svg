<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <!-- Main purple gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D09CFA"/>
      <!-- <stop offset="55%" stop-color="#A555EC"/> -->
      <stop offset="55%" stop-color="#B774F2"/>
      <!-- <stop offset="100%" stop-color="#A555EC"/>
      <stop offset="0%" stop-color="#7667ad"/>
      <stop offset="55%" stop-color="#5b4d91"/> -->
      <stop offset="100%" stop-color="#40356f"/>
    </linearGradient>

    <!-- Accent gradient -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3CCFF"/>
      <stop offset="100%" stop-color="#D09CFA"/>
    </linearGradient>

    <!-- Cream shine -->
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFD0" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#FFFFD0" stop-opacity="0"/>
    </linearGradient>

    <!-- Purple shine -->
    <linearGradient id="purpleShine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3CCFF" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#F3CCFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g transform="rotate(-8 32 32)">

    <!-- Background -->
    <rect
      x="4"
      y="4"
      width="56"
      height="56"
      rx="15"
      fill="url(#bg)"
    />

    <!-- Highlight -->
    <path
      d="M19 4h26c8 0 15 7 15 15v8c-11-6-22-9-35-9-8 0-15 2-21 6v-5c0-8 7-15 15-15z"
      fill="url(#shine)"
    />

    <!-- Accent -->
    <circle
      cx="50"
      cy="13"
      r="7"
      fill="url(#accent)"
    />

    <!-- Sparkle -->
    <path
      d="M50 7.5l1.6 3.9L55.5 13l-3.9 1.6L50 18.5l-1.6-3.9L44.5 13l3.9-1.6z"
      fill="#FFFFD0"
    />

    <!-- V -->
    <path
      d="M14 18h7.5L32 40l10.5-22H50L36 47h-8z"
      fill="#FFFFFF"
    />

  </g>
</svg>